#
# REUSE (https://reuse.software) metadata for files that cannot carry an SPDX
# header themselves. Source files carry their own SPDX lines. The espos/
# submodule is espOS's own and has its own REUSE.toml.
version = 1
SPDX-PackageName = "espos-seatalk-bridge"
SPDX-PackageSupplier = "Marcel Verpaalen"

[[annotations]]
path = ["**/*.json", "**/*.md", "**/*.png", "**/*.jpg", "version.txt", ".idf-version"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Marcel Verpaalen"
SPDX-License-Identifier = "Apache-2.0"
