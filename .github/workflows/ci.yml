name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config-descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - run: |
          # The hardware descriptor is a template; fill it as the esp32 build does.
          sed -e 's/@ST_HW_TARGET@/esp32/; s/@ST_HW_RX@/32/g; s/@ST_HW_TX@/33/g' \
              -e 's/@ST_HW_LED@/-1/g; s/@ST_HW_LED_TXT@/none/g' \
              main/config/seatalk_hw.json.in > /tmp/seatalk_hw.json
          python3 espos/components/espos_config/tools/espos_gen_config.py \
            --schema-out /tmp/schema.json --c-out /tmp/gen.c --h-out /tmp/keys.h \
            components/espos_seatalk/config/seatalk.json \
            /tmp/seatalk_hw.json \
            main/config/seatalk_console.json

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          cmake -S components/espos_seatalk/test/host -B build-host
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: ${{ matrix.target }}
          command: idf.py build

      - name: Check the espOS web UI made it into the image
        run: test -s build/storage.bin
