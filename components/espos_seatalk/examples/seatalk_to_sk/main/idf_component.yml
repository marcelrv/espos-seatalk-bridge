dependencies:
  idf: ">=6.1.0,<6.2.0"
  signalk-espos/espos_core:
    version: "^0.32.2"
  signalk-espos/espos_sk:
    version: "^0.32.2"
  signalk-espos/espos_ota:
    version: "^0.32.2"
  # The component this example ships with, taken from the tree it sits in
  # (components/espos_seatalk). No git source: the component manager would
  # fetch it even with override_path set, so CI would build the remote copy,
  # not the change under test.
  espos_seatalk:
    override_path: "../../.."
